[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-mesh"
version = "0.2.0"
description = "LAN Mesh 分布式 AI 工作站 — 局域网多智能体协作系统"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LAN Mesh Team"},
]

dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0",
    "pytest-cov>=4.1.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.1.0,<1.0",
]

[project.scripts]
lan-mesh = "main:main"

[tool.setuptools.packages.find]
include = ["lan_mesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # 行长度由 line-length 控制

[tool.ruff.isort]
known-first-party = ["lan_mesh"]
