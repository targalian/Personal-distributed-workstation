[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-mesh"
version = "0.2.0"
description = "LAN Mesh 分布式 AI 工作站 — 局域网多智能体协作系统"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "LAN Mesh Team"},
]

dependencies = [
    "fastapi>=0.104.0,<1.0",
    "uvicorn[standard]>=0.24.0,<1.0",
    "websockets>=12.0,<14.0",
    "psutil>=5.9.0,<7.0",
    "pydantic>=2.0.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31.0,<3.0",
    "python-multipart>=0.0.6,<1.0",
    "python-dotenv>=1.0.0,<2.0",
    "boto3>=1.28.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0",
    "pytest-cov>=4.1.0,<6.0",
    "ruff>=0.1.0,<1.0",
]

[project.scripts]
lan-mesh = "main:main"

[tool.setuptools.packages.find]
include = ["lan_mesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # 行长度由 line-length 控制

[tool.ruff.isort]
known-first-party = ["lan_mesh"]
