  #   plan_type: payg
  #   quota: 10.0
  #   unit: usd
  #   billing_period: monthly          # 每月 1 号重置
  #   api_key_env: OPENAI_API_KEY
  #   models: [gpt-4o, gpt-4o-mini]
  #   alert_threshold: 0.8             # 使用率达 80% 告警
  #   note: "日常开发预算"

  # 示例 2: token 包 (一次性额度, 带有效期)
