# 模型资源管理配置 (Model Resources)
# 复制为 resources.yaml 并填写你的实际资源池, 即可启用预算跟踪
# resources.yaml 已在 .gitignore 中排除, 请勿提交到版本库
#
# 核心概念: 资源池 = 一个可计量的预算来源, 三种计划类型:
#   payg        按量付费:  quota 为预算金额 (默认 USD), 消耗按 model_pool.yaml 价格实时折算
#   token_plan  token 包:  quota 为 token 数, 一次性额度 (可带 expire_at 有效期)
#   coding_plan 编程订阅:  quota 为每周期包含 token 数, 以 renew_at 为锚点周期重置
#
# 模型与资源池的关联规则:
#   - models 列表显式列出关联的模型 id (推荐, 精确控制)
#   - models 留空 → 该 provider 下所有模型自动关联 (按 model_pool.yaml 的 provider 匹配)
# 未关联任何资源池的模型: 默认放行 (宽松), 开启 strict: true 后禁用
#
# ── 余额自动探测 (R2, 可选) ──────────────────────────────────────
# 提供 API Key 两种方式 (二选一, 直填优先):
#   - 资源池内填 api_key: sk-xxx (仅存本机, 文件已 gitignore) — 推荐,
#     或在 Web 仪表盘「⚙️ 配置资源」向导中填写并一键测试
#   - 填 api_key_env: DEEPSEEK_API_KEY 并设置同名环境变量
# 然后运行 `python main.py resources --probe` 或 Web 仪表盘「探测余额」
# 自动调用服务商余额 API:
#   ✅ siliconflow  GET /v1/user/info        (CNY, 国际版 api.siliconflow.com)
#   ✅ deepseek     GET /user/balance        (total_balance + currency)
#   ✅ moonshot     GET /v1/users/me/balance (Kimi, 宽容解析)
#   ⚠️ zhipu        GET /api/monitor/usage/quota/limit (实验性)
#   ❌ openai / anthropic / ark / aliyun / google: 无普通 Key 余额接口, 控制台查看
# 探测到余额为 0 的资源池自动标记 exhausted (模型从路由剔除)
#
# ── 跨主机用量上报 (R3, 多主机场景) ─────────────────────────────
# Worker 主机的 LLM 用量自动汇总到 Secretary 统一计量:
#   - 独立 Worker 进程 (python main.py worker): 自动发现 Secretary, 免配置
#   - 内嵌 PM / Station 充当 Worker: 收到任务时自动注入上报目标, 免配置
#   - 静态配置 (可选): 填写 secretary_url, 后台线程按 report_interval
#     周期性批量上报; 上报失败自动重试 (离线容错), usage_id 幂等去重
# secretary_url: http://192.168.1.10:18080   # Secretary 站点地址 (Worker 主机填)
# report_interval: 60                         # 上报周期秒数 (默认 60)

# strict: true   # 取消注释后, 未关联资源池的模型将从路由中剔除

# ── 定价覆盖 (可选) ──────────────────────────────────────────────
# model_pool.yaml 已收录模型的单价自动生效, 无需重复填写。
# 仅当你的模型不在 model_pool.yaml 中时才需要在此补充 (单位: USD / 1K tokens)。
# 主流服务商按量参考价 (2026, 单位 USD/M tokens, 输入/输出, 以官方为准):
#   OpenAI    gpt-4o: 2.5/10,  gpt-4o-mini: 0.15/0.6, gpt-4.1: 2/8
#   Anthropic claude-sonnet-4: 3/15, claude-opus-4: 15/75, claude-haiku-4.5: 1/5
#   DeepSeek  deepseek-chat: 0.27/1.1 (cache miss/out), deepseek-reasoner: 0.55/2.19
#   Google    gemini-2.5-pro: 1.25/10, gemini-2.5-flash: 0.3/2.5
#   月之暗面  kimi-k2: 0.6/2.5, 智谱 glm-4.6: 0.6/2.6, 通义 qwen-max: 2.4/9.6
pricing:
  # gemini-2.5-pro:
  #   input_per_1k: 0.00125
  #   output_per_1k: 0.01

# ── 资源池定义 ───────────────────────────────────────────────────
resources:
