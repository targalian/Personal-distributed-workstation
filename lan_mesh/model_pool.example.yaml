    fallback: [qwen3.7-max, glm-5.2]

  # -- 智谱 GLM (Token Plan 个人版) --
  - id: glm-5.2
    provider: aliyun-tokenplan
    api_key_env: ALIYUN_TOKENPLAN_API_KEY
