# 模型池配置 (Model Pool)
# 复制为 model_pool.yaml 并填入实际 API Key 环境变量名
# model_pool.yaml 已在 .gitignore 中排除,请勿提交到版本库

models:
  # ── DeepSeek ─────────────────────────────────────────────────────
  - id: deepseek-chat
    provider: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    cost_input_per_1k: 0.0014
    cost_output_per_1k: 0.0028
    capabilities: [reasoning, coding]
    quality_score: 0.85
    speed_score: 0.80
    rate_limit_rpm: 200
    max_context_tokens: 65536
    fallback: [gpt-4o-mini, qwen-turbo]

  - id: deepseek-coder
    provider: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    cost_input_per_1k: 0.0014
    cost_output_per_1k: 0.0028
    capabilities: [coding]
    quality_score: 0.88
    speed_score: 0.78
    rate_limit_rpm: 200
    max_context_tokens: 65536
    fallback: [deepseek-chat, gpt-4o-mini]

  - id: deepseek-reasoner
    provider: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    cost_input_per_1k: 0.004
    cost_output_per_1k: 0.016
    capabilities: [reasoning, coding, long_context]
    quality_score: 0.92
    speed_score: 0.55
    rate_limit_rpm: 100
    max_context_tokens: 65536
    fallback: [gpt-4o, claude-3-5-sonnet]

  # ── OpenAI ───────────────────────────────────────────────────────
  - id: gpt-4o
    provider: openai
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    cost_input_per_1k: 0.0025
    cost_output_per_1k: 0.01
    capabilities: [reasoning, coding, vision, long_context]
    quality_score: 0.95
    speed_score: 0.70
    rate_limit_rpm: 100
    max_context_tokens: 128000
    fallback: [claude-3-5-sonnet, deepseek-reasoner]

  - id: gpt-4o-mini
    provider: openai
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    cost_input_per_1k: 0.00015
    cost_output_per_1k: 0.0006
    capabilities: [general, lightweight]
    quality_score: 0.75
    speed_score: 0.90
    rate_limit_rpm: 500
    max_context_tokens: 128000
    fallback: [qwen-turbo, deepseek-chat]

  - id: gpt-4-turbo
    provider: openai
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    cost_input_per_1k: 0.01
    cost_output_per_1k: 0.03
    capabilities: [reasoning, coding, vision, long_context]
    quality_score: 0.93
    speed_score: 0.55
    rate_limit_rpm: 60
    max_context_tokens: 128000
    fallback: [gpt-4o, claude-3-5-sonnet]

  # ── Anthropic ────────────────────────────────────────────────────
  - id: claude-3-haiku
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1
    cost_input_per_1k: 0.00025
    cost_output_per_1k: 0.00125
    capabilities: [general, lightweight]
    quality_score: 0.78
    speed_score: 0.88
    rate_limit_rpm: 300
    max_context_tokens: 200000
    fallback: [gpt-4o-mini, qwen-turbo]

  - id: claude-3-5-sonnet
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1
    cost_input_per_1k: 0.003
    cost_output_per_1k: 0.015
    capabilities: [reasoning, coding, long_context]
    quality_score: 0.96
    speed_score: 0.65
    rate_limit_rpm: 100
    max_context_tokens: 200000
    fallback: [gpt-4o, deepseek-reasoner]

  # ── 通义千问 ─────────────────────────────────────────────────────
  - id: qwen-turbo
    provider: qwen
    api_key_env: QWEN_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    cost_input_per_1k: 0.0003
    cost_output_per_1k: 0.0006
    capabilities: [general, lightweight]
    quality_score: 0.72
    speed_score: 0.92
    rate_limit_rpm: 300
    max_context_tokens: 32768
    fallback: [gpt-4o-mini, deepseek-chat]

  - id: qwen-plus
    provider: qwen
    api_key_env: QWEN_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    cost_input_per_1k: 0.0013
    cost_output_per_1k: 0.0038
    capabilities: [reasoning, coding]
    quality_score: 0.82
    speed_score: 0.75
    rate_limit_rpm: 200
    max_context_tokens: 65536
    fallback: [deepseek-chat, gpt-4o-mini]

  # ── 阿里云百炼 Token Plan 个人版 (订阅制, Credits 统一计量) ──────────
  # 获取 API Key: 百炼控制台 → 订阅(Token Plan) → 我的订阅 → 生成专属 API Key
  # 环境变量: export ALIYUN_TOKENPLAN_API_KEY="sk-sp-xxxxx"
  # 注意: 个人版专属 Key(sk-sp-*) 与团队版/通用百炼 Key 不通用
  # 限制: 仅限 AI 编程/智能体工具中交互式使用, 不支持生产级直接 API 调用
  # 并发: Lite 1-2 Agent / Standard 3-4 Agent / Pro 6-8 Agent
  # 夜间折扣: 22:00-08:00 qwen3.7系列低至2折

  # -- 千问系列 --
  - id: qwen3.8-max
    provider: aliyun-tokenplan
    api_key_env: ALIYUN_TOKENPLAN_API_KEY
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    cost_input_per_1k: 0.0     # 订阅制, 按Credits计量
    cost_output_per_1k: 0.0
    capabilities: [reasoning, coding, vision, long_context]
    quality_score: 0.97
    speed_score: 0.55
    rate_limit_rpm: 100
    max_context_tokens: 983616
    fallback: [qwen3.7-max, deepseek-v4-pro]

  - id: qwen3.7-max
    provider: aliyun-tokenplan
    api_key_env: ALIYUN_TOKENPLAN_API_KEY
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    cost_input_per_1k: 0.0
    cost_output_per_1k: 0.0
    capabilities: [reasoning, coding, long_context]
    quality_score: 0.95
    speed_score: 0.70
    rate_limit_rpm: 200
    max_context_tokens: 131072
    fallback: [qwen3.7-plus, deepseek-v4-pro]

  - id: qwen3.7-plus
    provider: aliyun-tokenplan
    api_key_env: ALIYUN_TOKENPLAN_API_KEY
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    cost_input_per_1k: 0.0
    cost_output_per_1k: 0.0
    capabilities: [reasoning, coding, vision, long_context]
    quality_score: 0.90
    speed_score: 0.78
    rate_limit_rpm: 200
    max_context_tokens: 131072
    fallback: [qwen3.6-flash, deepseek-v4-pro]

  - id: qwen3.6-flash
    provider: aliyun-tokenplan
    api_key_env: ALIYUN_TOKENPLAN_API_KEY
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    cost_input_per_1k: 0.0
    cost_output_per_1k: 0.0
    capabilities: [reasoning, coding, vision, lightweight]
    quality_score: 0.78
    speed_score: 0.92
    rate_limit_rpm: 500
    max_context_tokens: 131072
    fallback: [qwen3.7-plus, glm-5.2]

  # -- DeepSeek (Token Plan 个人版) --
  - id: deepseek-v4-pro
    provider: aliyun-tokenplan
    api_key_env: ALIYUN_TOKENPLAN_API_KEY
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
