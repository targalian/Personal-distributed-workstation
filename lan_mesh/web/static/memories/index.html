<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆与历史</title><link rel="stylesheet" href="../collaboration/style.css"><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>LAN MESH · 记忆</small><h1>记忆与历史</h1><p>从用户原消息确认记忆。每项记忆保留来源、修订记录和适用范围。</p></div><button id="refresh">刷新</button></header>
<div class="toolbar"><label for="conversations">所属对话</label><select id="conversations"><option value="">选择对话</option></select><label for="agents">消息来源</label><select id="agents"><option value="">秘书对话</option></select><span id="status" role="status"></span></div><p id="error" role="alert" hidden></p>
<main id="main" hidden><div class="columns"><section><h2>查找原消息</h2><form id="search-form"><label for="query">关键词</label><input id="query" required maxlength="128" placeholder="支持中文短词"><button>搜索历史</button></form><div id="results"></div><button id="more-search" hidden>更早的消息</button></section>
<section><h2 id="editor-title">确认新记忆</h2><p id="source-label">先从搜索结果选择用户原消息。</p><form id="memory-form"><label for="scope">适用范围</label><select id="scope"><option value="conversation">当前对话</option><option value="project">当前项目</option><option value="agent">当前 PM 线程</option></select><label for="content">确认后的记忆</label><textarea id="content" required maxlength="1000" rows="4"></textarea><label for="expires">有效期至（留空长期有效）</label><input id="expires" type="datetime-local"><label class="check"><input id="confirmed" type="checkbox" required>我已核对原消息并确认这项记忆</label><button id="save">保存记忆</button><button type="button" id="cancel-edit">取消编辑</button></form></section></div>
<section><div class="toolbar"><h2>可用记忆</h2><label class="check"><input id="inactive" type="checkbox">包含撤销、过期和来源缺失</label></div><div id="memories"></div><button id="more-memories" hidden>更多记忆</button></section>
<section id="detail-panel" hidden><h2 id="detail-title">原消息</h2><pre id="detail"></pre><button id="more-source" hidden>继续读取原文</button></section></main>
<section id="backup-panel"><h2>私有备份与恢复</h2><p>有项目的会话连同该项目其他会话一起备份，以保留项目记忆的来源。原文和修订记录仅复制到你选择的工作站。</p><div class="toolbar"><button id="export-backup">创建所选会话的快照</button><label for="backup-peer">目标工作站</label><select id="backup-peer"><option value="">选择已登记工作站</option></select><button id="refresh-backups">刷新备份</button></div><p>故障恢复：在备用实例激活秘书，再恢复已接收的快照。目标已有同项目会话时拒绝覆盖；不会启动旧任务。</p><div id="backups"></div></section>
<script src="../mesh_transport.js"></script><script src="backups.js"></script><script src="memories.js"></script></body></html>
