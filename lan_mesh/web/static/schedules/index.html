<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周期任务与消息入口</title><link rel="stylesheet" href="../collaboration/style.css"><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>LAN MESH · 计划</small><h1>周期任务与消息入口</h1><p>计划和消息入口归属一个对话，使用相同的项目、任务和操作权限。</p></div><button id="refresh">刷新</button></header>
<div class="toolbar"><label for="conversations">所属对话</label><select id="conversations"><option value="">选择对话</option></select><span id="status" role="status"></span></div><p id="error" role="alert" hidden></p>
<main id="main" hidden><section><h2>新建周期计划</h2><form id="schedule-form"><label for="name">计划名称</label><input id="name" required maxlength="200"><label for="description">每次执行的任务要求</label><textarea id="description" required rows="3" maxlength="32000"></textarea><div class="columns"><div><label for="kind">频率</label><select id="kind"><option value="daily">每天</option><option value="interval">固定间隔</option></select><label for="zone">时区</label><input id="zone" required value="Asia/Shanghai"><div id="daily"><label for="at">当地时间</label><input id="at" type="time" value="09:00" required></div><div id="interval" hidden><label for="minutes">间隔（分钟）</label><input id="minutes" type="number" min="1" max="527040" value="60"></div></div><div><label for="catchup">停机后</label><select id="catchup"><option value="skip">跳过漏跑</option><option value="once">补跑最近一次</option></select><label for="concurrency">上次任务仍在执行时</label><select id="concurrency"><option value="forbid">跳过本次，避免重叠</option><option value="allow">允许新任务同时执行</option></select><p>夏令时跳过的当地时间当天不执行；重复出现的当地时间只执行一次。</p></div></div><button type="submit">保存并启用计划</button></form></section>
<section><h2>当前对话的计划</h2><div id="schedules"></div></section><section id="history-panel" hidden><h2>触发记录</h2><div id="history"></div></section>
<section><h2>IM 房间绑定</h2><p>由管理员绑定已认证的消息桥接入口。消息内容不能更改所属对话或项目。</p><form id="im-form"><label for="channel">通道</label><select id="channel"><option value="telegram">Telegram</option><option value="wecom">企业微信桥接</option><option value="feishu">飞书桥接</option><option value="webhook">自定义桥接</option></select><label for="room">聊天或房间标识</label><input id="room" required maxlength="200"><button id="bind" type="submit">绑定房间</button></form><div id="bindings"></div></section>
<section><h2>消息处理记录</h2><p>待核对表示处理或回复的结果无法确认，请先查看任务与消息记录。</p><div id="events"></div></section></main><script src="../mesh_transport.js"></script><script src="schedules.js"></script></body></html>
