# LAN Mesh 配置文件
# 放置在 ~/.lan_mesh/config.yaml 或项目根目录 config.yaml 即可自动加载

# UDP 发现配置
discovery:
  port: 45454              # UDP 广播发现端口 (与 QuickLAN 一致)
  presence_interval: 3     # 广播间隔 (秒)
  device_ttl: 12           # 设备离线判定阈值 (秒)

# Worker 节点配置
worker:
  api_port: 45460          # HTTP API 起始端口
  shared_folder: ~/lan_mesh_shared
  device_name: ""          # 留空则自动使用 hostname

# Secretary 节点配置
secretary:
  api_port: 45470          # HTTP API + Web UI 端口
  shared_folder: ~/lan_mesh_shared
  device_name: ""          # 留空则自动使用 hostname-secretary
  db_path: ~/.lan_mesh/secretary.sqlite3

# 云存储配置 (跨主机共享文件夹同步)
# 支持 S3 兼容服务: 阿里云 OSS、MinIO、AWS S3 等
# 密钥建议通过环境变量配置: CLOUD_STORAGE_ACCESS_KEY / CLOUD_STORAGE_SECRET_KEY
cloud_storage:
  enabled: false
  endpoint: ""             # S3 端点 (如 oss-cn-hangzhou.aliyuncs.com)
  bucket: "lan-mesh"       # 存储桶名称
  prefix: "shared/"        # 桶内路径前缀
  access_key: ""           # 访问密钥 (优先使用环境变量 CLOUD_STORAGE_ACCESS_KEY)
  secret_key: ""           # 密钥 (优先使用环境变量 CLOUD_STORAGE_SECRET_KEY)
  region: ""               # 区域 (如 us-east-1, 部分服务可留空)
  secure: true             # 是否使用 HTTPS
  auto_sync: true          # 启动时自动同步
  sync_interval: 300       # 自动同步间隔 (秒), 0 表示仅启动时同步一次

# 版本自动对齐 (F1): 落后节点自动 git pull + 依赖安装
# 安全边界: 工作区有未提交改动时自动跳过, 绝不覆盖本地改动
# 关闭方式: auto_upgrade: false
auto_upgrade: true

# 可观测性配置 (iter-43; iter-50 增自动自愈守护)
# 任务停滞检测: 未到终态的任务超过阈值无阶段事件即标记停滞并主动告警 (WS + Bot)
observability:
  stall_check_interval: 60   # 后台检查周期 (秒, 实际最小 10)
  stall_minutes: 30          # 停滞判定阈值 (分钟), 0 或负数 = 禁用检测与告警
  # 自动自愈守护 (iter-50, 默认关): 周期扫描诊断结果, 对安全动作自动执行 (同类别冷却去重)
  auto_heal_enabled: false   # 是否启用自动自愈 (打开后由守护线程周期执行)
  auto_heal_interval: 300    # 自动自愈扫描周期 (秒, 实际最小 30)
  auto_heal_cooldown: 600    # 同类别动作冷却期 (秒), 防执行风暴

# 安全配置
security:
  auth_enabled: true         # 是否启用节点间 Token 认证 (P2 #5 起默认启用)
  # mesh_token: ""          # 显式指定全网共享 token (留空则自动生成/持久化)
  # token 来源优先级: security.mesh_token > 环境变量 LAN_MESH_TOKEN > ~/.lan_mesh/mesh_token
  # 启用后所有内部 API 请求需携带 Authorization: Bearer <token>
  # Worker 首次注册时由 Secretary 自动下发 token (免手工配置)
  # 提示: 同一局域网内所有节点应共享同一 token, 推荐显式配置或统一环境变量

# Bot 手机通道配置
bot:
  aggregate_window: 30     # 消息聚合窗口 (秒), 0=禁用聚合直接推送
  max_retry: 3             # 发送失败最大重试次数
  retry_backoff: 2.0       # 重试退避基数 (秒), 实际等待 = backoff^attempt
  quiet_hours:             # 免打扰时段
    enabled: false
    start: "23:00"         # 开始时间
    end: "08:00"           # 结束时间
    override_priority: high  # 此级别及以上可穿透免打扰
  channels: []
  # 通道示例:
  # - channel_type: telegram
  #   enabled: true
  #   bot_token: "123456:ABC-DEF"
  #   chat_id: "987654321"
  #   min_priority: normal
  # - channel_type: wechat_webhook
  #   enabled: true
  #   webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"
  #   min_priority: high
